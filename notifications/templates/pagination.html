{% load static %}

<nav aria-label="Page navigation">
        <ul class="pagination my-4">
            {% if page.has_previous %}
                <a href="?page={{ page.previous_page_number }}">
                    <img src="{% static 'img/arrow_one_left.png' %}">
                </a>
                <a href="?page=1">
                    <img src="{% static 'img/arrow_two_left.png' %}">
                </a>

            {% endif %}
            <li class="page-item active">
                <a>{{ page.number }} z {{ page.paginator.num_pages }}</a>
            </li>
        {% if page.has_next %}
            <a href="?page={{ page.next_page_number }}">
                <img src="{% static 'img/arrow_one.png' %}">
            </a>
            <a href="?page={{ page.paginator.num_pages }}">
                <img src="{% static 'img/arrow_two.png' %}">
            </a>
        {% endif %}
        </ul>
    </nav>
